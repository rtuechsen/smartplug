  /api/switch:
    post:
      summary: Control the state of an item
      description: TODO # TODO
      requestBody:
        description: TODO # TODO
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                  description: The unique id of the item.
                desired_isOn:
                  type: boolean
                  description: Whether the goal is to turn the item ON (true) or OFF (false).
              required:
