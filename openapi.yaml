openapi: 3.1.0
info:
  title: Smartplug Dirigent
  description: This API allows to view and control smartplugs.
  version: 0.1.0
components:
  schemas:
    ItemId:
      type: string
    TreeItem: 
      type: object
      properties:
        label:
          type: string
        id:
          $ref: "#/components/schemas/ItemId"
        isOn:
          type: boolean
        isAvailable:
          type: boolean
      required:
        - label
        - id
        - isOn
        - isAvailable
      additionalProperties: false
    TreeItemDevice:
      allOf:
        - $ref: "#/components/schemas/TreeItem"
        - type: object
    ItemList:
      type: array
      items:
        oneOf:
          - $ref: "#/components/schemas/TreeItemGroup"
          - $ref: "#/components/schemas/TreeItemDevice"
    TreeItemGroup:
      allOf:
        - $ref: "#/components/schemas/TreeItem"
        - type: object
          properties:
            children:
              $ref: "#/components/schemas/ItemList"
          required:
            - children
          additionalProperties: false
